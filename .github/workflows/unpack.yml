name: unpack
on:
  push:
    branches: [feature/usa-ft-c2c-w2]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          if ls changed_files*.zip >/dev/null 2>&1; then
            for z in changed_files*.zip; do unzip -o "$z"; done
            cp -r changed/. .
            rm -rf changed changed_files*.zip
            git config user.name "unpack-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "Apply USA market changes"
            git push
          fi
